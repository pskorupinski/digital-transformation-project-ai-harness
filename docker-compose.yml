# Dev environment: Postgres + FastAPI (hot reload) + Vite (hot reload).
#   docker compose up --build        → frontend http://localhost:5173, API http://localhost:8000/docs
#   docker compose down -v           → also wipes the database volume
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      TEST_DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_test
      INTEGRATIONS_MODE: ${INTEGRATIONS_MODE:-fake}
      REPO_ROOT: /repo
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - .:/repo:ro   # docs/ + frontend tests, read by tests/test_traceability.py
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
